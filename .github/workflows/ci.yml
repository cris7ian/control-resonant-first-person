name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Portable core and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build core
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
          python3 -m unittest discover -s tests -p '*_tests.py'

  windows:
    name: Windows x64 native checks
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
      - name: Build native mod
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build
      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
          python -m unittest discover -s tests -p '*_tests.py'
      - name: Verify real stripped release artifacts
        run: python tests/release_artifact_integration.py --build build --strip-tool strip
